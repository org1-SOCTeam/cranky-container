name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AZURE_FUNCTION_NAME: cranky-container-func
  AZURE_RESOURCE_GROUP: cranky-rg
  AZURE_REGION: eastus

jobs:
  build:
    name: Build & Push Container
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.AZURE_REGISTRY_URL }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.AZURE_REGISTRY_URL }}/cranky-container
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  test-deployment:
    name: Test Container Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run container tests
        run: |
          docker run --rm \
            -e ENVIRONMENT=test \
            ${{ needs.build.outputs.image_tag }} \
            python -m pytest tests/ -v

  deploy-function:
    name: Deploy to Azure Function
    runs-on: ubuntu-latest
    needs: [build, test-deployment]
    environment:
      name: production
      url: https://${{ env.AZURE_FUNCTION_NAME }}.azurewebsites.net

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Function App
        uses: azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTION_NAME }}
          package: .
          runtime: 'python'
          runtime-version: '3.11'
          build-remote: true
          remote-build: true

  deploy-vm:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: [build, test-deployment]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Run deployment script on VM
        run: |
          az vm run-command invoke \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name cranky-container-vm \
            --command-id RunShellScript \
            --scripts "
              docker pull ${{ needs.build.outputs.image_tag }}
              docker stop cranky-container || true
              docker rm cranky-container || true
              docker run -d \
                --name cranky-container \
                -p 8000:8000 \
                -e ENVIRONMENT=production \
                -e DEPLOYMENT_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
                ${{ needs.build.outputs.image_tag }}
            " || true

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-function, deploy-vm]
    if: always()

    steps:
      - name: Check Function App Health
        run: |
          for i in {1..5}; do
            echo "Attempt $i..."
            curl -f https://${{ env.AZURE_FUNCTION_NAME }}.azurewebsites.net/health && exit 0
            sleep 10
          done
          echo "Function App health check failed after 5 attempts"
          exit 1

      - name: Verify API endpoints
        run: |
          BASE_URL="https://${{ env.AZURE_FUNCTION_NAME }}.azurewebsites.net"

          echo "Checking /health..."
          curl -f $BASE_URL/health || exit 1

          echo "Checking /greet/Workshop..."
          curl -f "$BASE_URL/greet/Workshop" || exit 1

          echo "Checking /metrics..."
          curl -f $BASE_URL/metrics || exit 1

          echo "All endpoints healthy! ✅"

  rollback:
    name: Rollback (if deployment fails)
    runs-on: ubuntu-latest
    needs: health-check
    if: failure()

    steps:
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Rollback to previous version
        run: |
          echo "⚠️  Deployment failed. Rolling back to previous version..."
          az webapp deployment slot swap \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --name ${{ env.AZURE_FUNCTION_NAME }} \
            --slot staging || echo "Rollback completed (or no staging slot)"

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: health-check
    if: always()

    steps:
      - name: Deployment Success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🚀 App is live at: https://${{ env.AZURE_FUNCTION_NAME }}.azurewebsites.net"
          echo "📊 Commit: ${{ github.sha }}"
          echo "👤 Deployed by: ${{ github.actor }}"

      - name: Deployment Failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo "📝 Check logs above for details"
          echo "🔄 Rollback initiated"
