name: Deploy to Staging (GCP)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build & Push Container
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cranky-container:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar

  deploy-staging:
    name: Deploy to GCP Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: http://34.21.136.25:8001

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Deploy to Staging VM
        run: |
          gcloud compute ssh ubuntu-cicd-vm \
            --zone=asia-southeast1-a \
            --project=toylabs \
            --command="
              set -e
              echo '📥 Pulling latest image...'
              docker pull asia-southeast1-docker.pkg.dev/toylabs/simple-app-repo/cranky-container:develop || true

              echo '🛑 Stopping existing container...'
              docker stop cranky-staging 2>/dev/null || true
              docker rm cranky-staging 2>/dev/null || true

              echo '▶️  Starting new container...'
              docker run -d \
                --name cranky-staging \
                --restart always \
                -p 8001:8000 \
                -e ENVIRONMENT=staging \
                -e DEPLOYMENT_TIME=\$(date -u +%Y-%m-%dT%H:%M:%SZ) \
                -e DEPLOYMENT_BY=${{ github.actor }} \
                asia-southeast1-docker.pkg.dev/toylabs/simple-app-repo/cranky-container:develop

              echo '⏳ Waiting for health check...'
              sleep 5

              echo '✅ Checking health...'
              curl -f http://localhost:8001/health && echo 'Health check passed' || exit 1
            "

      - name: Verify Staging Deployment
        run: |
          echo "🔍 Verifying deployment..."
          curl -f http://34.21.136.25:8001/health
          echo ""
          echo "✅ Staging deployment successful!"
          echo "📍 URL: http://34.21.136.25:8001"
