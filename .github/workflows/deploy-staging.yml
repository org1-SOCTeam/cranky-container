name: Deploy to Staging (GCP)

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: org1-socteam/cranky-container

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  build-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}

    permissions:
      contents: 'read'
      packages: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    needs: build-push
    runs-on: ubuntu-latest
    environment:
      name: staging

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Prepare deploy script
        env:
          SHA_SHORT: ${{ needs.build-push.outputs.sha_short }}
        run: |
          cat > /tmp/deploy_staging.sh << 'SCRIPTEOF'
          #!/bin/bash
          set -euo pipefail

          IMAGE="__REGISTRY__/__IMAGE_NAME__:develop"
          CONTAINER_NAME="cranky-staging"
          PORT=8001

          echo "🚀 Deploying Cranky Container to Staging"
          echo "  Image: $IMAGE"
          echo "  Container: $CONTAINER_NAME"
          echo "  Port: $PORT"

          # Login to GitHub Container Registry
          echo "📥 Authenticating to GHCR..."
          printf '%s' '__GHCR_TOKEN__' | sudo docker login ghcr.io -u __GHCR_USER__ --password-stdin

          # Pull image
          echo "📥 Pulling image..."
          docker pull "$IMAGE"

          # Stop old container
          echo "🛑 Stopping old container..."
          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true

          # Start new container
          echo "▶️  Starting new container..."
          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart always \
            -p ${PORT}:8000 \
            -e ENVIRONMENT=staging \
            -e DEPLOYMENT_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -e DEPLOYED_BY="__DEPLOYED_BY__" \
            --health-cmd="python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1" \
            --health-interval=30s \
            --health-timeout=10s \
            --health-retries=3 \
            "$IMAGE"

          # Wait for health
          echo "⏳ Waiting for health check..."
          sleep 10
          docker exec "$CONTAINER_NAME" python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" || exit 1

          echo "✅ Deployment successful!"
          docker ps -f "name=$CONTAINER_NAME"
          SCRIPTEOF

          # Substitute values
          sed -i "s|__REGISTRY__|${{ env.REGISTRY }}|g" /tmp/deploy_staging.sh
          sed -i "s|__IMAGE_NAME__|${{ env.IMAGE_NAME }}|g" /tmp/deploy_staging.sh
          sed -i "s|__DEPLOYED_BY__|${{ github.actor }}|g" /tmp/deploy_staging.sh
          sed -i "s|__GHCR_TOKEN__|${{ secrets.GITHUB_TOKEN }}|g" /tmp/deploy_staging.sh
          sed -i "s|__GHCR_USER__|${{ github.actor }}|g" /tmp/deploy_staging.sh
          chmod +x /tmp/deploy_staging.sh

      - name: Deploy to VM via IAP
        run: |
          # Copy script to VM
          gcloud compute scp /tmp/deploy_staging.sh ubuntu-cicd-vm:/tmp/deploy_staging.sh \
            --quiet \
            --tunnel-through-iap \
            --zone=asia-southeast1-a \
            --project=toylabs

          # Execute script
          gcloud compute ssh ubuntu-cicd-vm \
            --quiet \
            --tunnel-through-iap \
            --zone=asia-southeast1-a \
            --project=toylabs \
            --command="sudo bash /tmp/deploy_staging.sh && rm -f /tmp/deploy_staging.sh"

      - name: Verify Deployment
        run: |
          echo "✅ Deployment complete!"
          echo "📍 Staging URL: ${{ secrets.STAGING_URL }}"
          echo "💡 Verify manually or via: gcloud compute ssh ubuntu-cicd-vm --zone=asia-southeast1-a --project=toylabs --tunnel-through-iap --command='docker ps'"
