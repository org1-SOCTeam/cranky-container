name: Deploy to Production (Azure)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: org1-socteam/cranky-container

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  build-push:
    name: Build & Push Image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}

    permissions:
      contents: 'read'
      packages: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    name: Deploy to Production (Azure)
    needs: build-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://4.194.6.165:8001

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare deploy script
        env:
          SHA_SHORT: ${{ needs.build-push.outputs.sha_short }}
        run: |
          cat > /tmp/deploy_prod.sh << 'SCRIPTEOF'
          #!/bin/bash
          set -euo pipefail

          IMAGE="__REGISTRY__/__IMAGE_NAME__:main"
          CONTAINER_NAME="cranky-prod"
          PORT=8001

          echo "🚀 Deploying Cranky Container to Production (Azure)"
          echo "  Image: $IMAGE"
          echo "  Container: $CONTAINER_NAME"
          echo "  Port: $PORT"

          # Login to GitHub Container Registry
          echo "📥 Authenticating to GHCR..."
          printf '%s' '__GHCR_TOKEN__' | sudo docker login ghcr.io -u __GHCR_USER__ --password-stdin

          # Pull image
          echo "📥 Pulling image..."
          sudo docker pull "$IMAGE"

          # Stop old container (with backup)
          echo "🛑 Stopping old container..."
          if sudo docker ps -a --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
            BACKUP_NAME="${CONTAINER_NAME}-backup-$(date +%s)"
            sudo docker rename $CONTAINER_NAME $BACKUP_NAME || true
            echo "  Previous container backed up as: $BACKUP_NAME"
          fi
          sudo docker rm $CONTAINER_NAME 2>/dev/null || true

          # Start new container
          echo "▶️  Starting new container..."
          sudo docker run -d \
            --name "$CONTAINER_NAME" \
            --restart always \
            -p ${PORT}:8000 \
            -e ENVIRONMENT=production \
            -e DEPLOYMENT_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -e DEPLOYED_BY="__DEPLOYED_BY__" \
            --health-cmd="python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1" \
            --health-interval=30s \
            --health-timeout=10s \
            --health-retries=3 \
            "$IMAGE"

          # Wait for health
          echo "⏳ Waiting for health check..."
          sleep 10
          sudo docker exec "$CONTAINER_NAME" python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" || exit 1

          echo "✅ Deployment successful!"
          sudo docker ps -f "name=$CONTAINER_NAME"
          SCRIPTEOF

          # Substitute values
          sed -i "s|__REGISTRY__|${{ env.REGISTRY }}|g" /tmp/deploy_prod.sh
          sed -i "s|__IMAGE_NAME__|${{ env.IMAGE_NAME }}|g" /tmp/deploy_prod.sh
          sed -i "s|__DEPLOYED_BY__|${{ github.actor }}|g" /tmp/deploy_prod.sh
          sed -i "s|__GHCR_TOKEN__|${{ secrets.GITHUB_TOKEN }}|g" /tmp/deploy_prod.sh
          sed -i "s|__GHCR_USER__|${{ github.actor }}|g" /tmp/deploy_prod.sh
          chmod +x /tmp/deploy_prod.sh

      - name: Deploy to Azure VM via SSH
        run: |
          # Copy script to Azure VM
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no /tmp/deploy_prod.sh azureuser@4.194.6.165:/tmp/deploy_prod.sh

          # Execute script
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no azureuser@4.194.6.165 "bash /tmp/deploy_prod.sh && rm -f /tmp/deploy_prod.sh"

      - name: Verify Deployment
        run: |
          echo "✅ Production deployment complete!"
          echo "📍 Production URL: http://4.194.6.165:8001"
          echo "💡 Verify manually: curl -f http://4.194.6.165:8001/health"
