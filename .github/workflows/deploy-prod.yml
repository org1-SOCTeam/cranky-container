name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build & Push Container
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: cranky-container:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar

  test-deployment:
    name: Test Container Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/image.tar

      - name: Run container tests
        run: |
          docker run --rm \
            -e ENVIRONMENT=test \
            cranky-container:${{ github.sha }} \
            python -m pytest tests/ -v

  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test-deployment]
    environment:
      name: production
      url: http://34.128.100.109:8000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Deploy to Production VM
        run: |
          # Check if prod VM is running
          STATUS=$(gcloud compute instances describe prod-satuck-vm \
            --zone=asia-southeast2-a \
            --project=toylabs \
            --format='value(status)')

          if [ "$STATUS" != "RUNNING" ]; then
            echo "🔌 Starting Production VM..."
            gcloud compute instances start prod-satuck-vm \
              --zone=asia-southeast2-a \
              --project=toylabs
            sleep 30
          fi

          echo "📥 Deploying to Production..."
          gcloud compute ssh prod-satuck-vm \
            --zone=asia-southeast2-a \
            --project=toylabs \
            --command="
              set -e

              echo '📥 Pulling latest image...'
              docker pull asia-southeast1-docker.pkg.dev/toylabs/simple-app-repo/cranky-container:main || true

              echo '🛑 Stopping existing container...'
              BACKUP_NAME=\"cranky-prod-backup-\$(date +%s)\"
              if docker ps -a --format '{{.Names}}' | grep -q '^cranky-prod$'; then
                docker rename cranky-prod \$BACKUP_NAME || true
              fi
              docker rm cranky-prod 2>/dev/null || true

              echo '▶️  Starting new container...'
              docker run -d \
                --name cranky-prod \
                --restart always \
                -p 8000:8000 \
                -e ENVIRONMENT=production \
                -e DEPLOYMENT_TIME=\$(date -u +%Y-%m-%dT%H:%M:%SZ) \
                -e DEPLOYMENT_BY=${{ github.actor }} \
                asia-southeast1-docker.pkg.dev/toylabs/simple-app-repo/cranky-container:main

              echo '⏳ Waiting for health check...'
              sleep 10

              echo '✅ Checking health...'
              if curl -f http://localhost:8000/health; then
                echo 'Health check passed'
              else
                echo '❌ Health check failed - rolling back'
                if [ ! -z \"\$BACKUP_NAME\" ]; then
                  docker rename \$BACKUP_NAME cranky-prod
                  docker start cranky-prod
                  echo 'Rolled back to previous version'
                fi
                exit 1
              fi
            "

      - name: Verify Production Deployment
        run: |
          # Get prod VM external IP
          PROD_IP=$(gcloud compute instances describe prod-satuck-vm \
            --zone=asia-southeast2-a \
            --project=toylabs \
            --format='value(networkInterfaces[0].accessConfigs[0].natIP)')

          echo "🔍 Verifying production deployment..."
          echo "📍 Production IP: $PROD_IP"

          # Wait for service to be ready
          for i in {1..5}; do
            if curl -f http://$PROD_IP:8000/health 2>/dev/null; then
              echo "✅ Production deployment successful!"
              echo "📍 URL: http://$PROD_IP:8000"
              exit 0
            fi
            echo "Attempt $i/5..."
            sleep 5
          done

          echo "❌ Production health check failed"
          exit 1

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy-prod
    if: always()

    steps:
      - name: Success
        if: success()
        run: |
          echo "✅ Production deployment completed successfully"
          echo "🎉 Version: ${{ github.sha }}"
          echo "👤 Deployed by: ${{ github.actor }}"

      - name: Failure
        if: failure()
        run: |
          echo "❌ Production deployment failed"
          echo "Please check the logs above"
